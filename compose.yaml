services:
  ms-vinculacion:
    build:
      context: ./backend/ms-vinculacion
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/corpaliv_data;DB_CLOSE_ON_EXIT=FALSE"
    volumes:
      - corpaliv_data:/app/data

volumes:
  corpaliv_data:
